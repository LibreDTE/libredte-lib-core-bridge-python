[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libredte-lib-core-bridge"
version = "0.2.0"
description = "Bridge Python para la biblioteca real libredte/libredte-lib-core, vía libredte-lib-core-dispatcher."
readme = "README.rst"
license = { file = "COPYING" }
authors = [
  { name = "LibreDTE" },
]
requires-python = ">=3.14"
dependencies = [
  "derafu-backbone-bridge~=0.2.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://www.libredte.cl"
Source = "https://github.com/libredte/libredte-lib-core-bridge-python"

[tool.hatch.build.targets.wheel]
packages = ["libredte_lib_core_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]

include = ["**/*.py", "**/*.pyi"]

exclude = [
  ".git",
  "__pycache__",
  ".venv",
  "venv",
]

line-length = 79
target-version = "py314"
respect-gitignore = true
fix = true

[tool.ruff.lint]

select = [
  "D",
  "F",
  "E",
  "W",
  "I",
  "UP",
  "N",
  "B",
  "A",
  "C90",
  "ARG",
  "DTZ",
  "TRY",
  "SLF",
  "ERA",
  "PL",
  "RUF",
]

ignore = [
  "D102",
  "D203",
  "D212",
  "TRY400",
  "N818",
  "UP031",
  "TRY003",
  "ARG001",
  "Q001",
  "ERA001",
  "PLC0415",
  "N802",
  "N806",
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 25
max-statements = 60

[tool.ruff.format]
quote-style = "single"
